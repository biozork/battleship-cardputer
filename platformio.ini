; PlatformIO project file: tells PlatformIO which chip, framework and libraries to use.
; Versions are pinned so a build today and a build next month produce the same firmware.

[env:cardputer]
platform = espressif32@6.10.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

; The StampS3 talks USB natively; these make Serial.print show up in the monitor.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; M5Cardputer 1.1.x is the first version that supports the ADV's TCA8418 keyboard.
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.27
    m5stack/M5GFX@0.2.34
